name: Integrate
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  lint:
    runs-on: ubuntu-latest
    name: Lint
    steps:
      - uses: holepunchto/actions/node-base@v1
        with:
          force-install: true
      - run: npm run lint
  test:
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
    runs-on: ${{ matrix.os }}
    name: Test / ${{ matrix.os }}
    steps:
      - uses: holepunchto/actions/bare-base@v1
        with:
          force-install: true
      - uses: lukka/get-cmake@latest
      - run: rustup toolchain install 1.98.1 --profile minimal
        shell: bash
      - id: host
        run: echo "target=$(bare -p 'Bare.platform + "-" + Bare.arch')" >> "$GITHUB_OUTPUT"
        shell: bash
      - uses: holepunchto/actions/compile-prebuilds@v1
        with:
          prefix: npm/${{ steps.host.outputs.target }}/prebuilds
      - run: npm test
