name: Prebuild

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prebuild:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            platform: darwin
            arch: arm64
            triple: aarch64-apple-darwin
          - os: macos-14
            platform: darwin
            arch: x64
            triple: x86_64-apple-darwin
          - os: ubuntu-22.04
            platform: linux
            arch: x64
            triple: x86_64-unknown-linux-gnu
          - os: ubuntu-22.04-arm
            platform: linux
            arch: arm64
            triple: aarch64-unknown-linux-gnu
          - os: windows-2022
            platform: win32
            arch: x64
            triple: x86_64-pc-windows-msvc
          - os: ubuntu-24.04
            platform: android
            arch: arm64
            triple: aarch64-linux-android
          - os: ubuntu-24.04
            platform: android
            arch: arm
            triple: armv7-linux-androideabi
          - os: ubuntu-24.04
            platform: android
            arch: x64
            triple: x86_64-linux-android
          - os: macos-14
            platform: ios
            arch: arm64
            triple: aarch64-apple-ios
          - os: macos-14
            platform: ios
            arch: arm64
            tags: '-simulator'
            flags: '--simulator'
            triple: aarch64-apple-ios-sim
          - os: macos-14
            platform: ios
            arch: x64
            tags: '-simulator'
            flags: '--simulator'
            triple: x86_64-apple-ios
    runs-on: ${{ matrix.os }}
    name: Build / ${{ matrix.platform }}-${{ matrix.arch }}${{ matrix.tags }}
    steps:
      - uses: holepunchto/actions/bare-base@v1
        with:
          force-install: true
      - uses: lukka/get-cmake@latest
      - name: Install Rust ${{ matrix.triple }}
        run: rustup toolchain install 1.98.1 --profile minimal --target ${{ matrix.triple }}
        shell: bash
      - uses: holepunchto/actions/compile-prebuilds@v1
        with:
          platform: ${{ matrix.platform }}
          arch: ${{ matrix.arch }}
          flags: ${{ matrix.flags }}
          tags: ${{ matrix.tags }}
          prefix: install/${{ matrix.platform }}-${{ matrix.arch }}${{ matrix.tags }}/prebuilds
      - uses: holepunchto/actions/upload-prebuilds@v1
        with:
          platform: ${{ matrix.platform }}
          arch: ${{ matrix.arch }}
          tags: ${{ matrix.tags }}
          prefix: install

  merge:
    runs-on: ubuntu-latest
    needs: prebuild
    name: Merge
    steps:
      - uses: holepunchto/actions/merge-prebuilds@v1
