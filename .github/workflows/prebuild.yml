name: Prebuild

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prebuild:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            platform: darwin
            arch: arm64
            triple: aarch64-apple-darwin
          - os: macos-14
            platform: darwin
            arch: x64
            triple: x86_64-apple-darwin
          - os: ubuntu-22.04
            platform: linux
            arch: x64
            triple: x86_64-unknown-linux-gnu
          - os: ubuntu-22.04-arm
            platform: linux
            arch: arm64
            triple: aarch64-unknown-linux-gnu
          - os: windows-2022
            platform: win32
            arch: x64
            triple: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    name: Build / ${{ matrix.platform }}-${{ matrix.arch }}
    steps:
      - uses: holepunchto/actions/bare-base@v1
      - uses: lukka/get-cmake@latest
      - name: Install Rust ${{ matrix.triple }}
        run: rustup toolchain install 1.98.1 --profile minimal --target ${{ matrix.triple }}
        shell: bash
      - uses: holepunchto/actions/compile-prebuilds@v1
        with:
          platform: ${{ matrix.platform }}
          arch: ${{ matrix.arch }}
          upload: true

  merge:
    runs-on: ubuntu-latest
    needs: prebuild
    name: Merge
    steps:
      - uses: holepunchto/actions/merge-prebuilds@v1
