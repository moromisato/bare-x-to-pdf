name: Publish

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: npm dist-tag to publish under
        default: beta

permissions:
  contents: read

jobs:
  prebuild:
    uses: ./.github/workflows/prebuild.yml

  publish:
    runs-on: ubuntu-latest
    needs: prebuild
    steps:
      - uses: holepunchto/actions/bare-base@v1
        with:
          registry-url: https://registry.npmjs.org
          node-auth-token: ${{ secrets.NPM_TOKEN }}
      - uses: holepunchto/actions/download-prebuilds@v1
        with:
          prefix: npm
      - name: Publish to npm
        run: |
          tag="${{ inputs.tag || 'beta' }}"
          version="$(node -p "require('./package.json').version")"
          for dir in npm/*/; do
            (cd "$dir" && npm publish --ignore-scripts --tag "$tag")
            npm dist-tag add "$(node -p "require('./$dir/package.json').name")@$version" latest
          done
          npm publish --ignore-scripts --tag "$tag"
          npm dist-tag add "bare-x-to-pdf@$version" latest
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
