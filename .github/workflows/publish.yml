name: Publish

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: npm dist-tag to publish under
        default: beta

permissions:
  contents: read

jobs:
  prebuild:
    uses: ./.github/workflows/prebuild.yml

  publish:
    runs-on: ubuntu-latest
    needs: prebuild
    steps:
      - uses: holepunchto/actions/bare-base@v1
        with:
          registry-url: https://registry.npmjs.org
          node-auth-token: ${{ secrets.NPM_TOKEN }}
      - uses: holepunchto/actions/download-prebuilds@v1
      - name: Publish to npm
        run: |
          npm publish --tag ${{ inputs.tag || 'beta' }}
          npm dist-tag add "bare-x-to-pdf@$(node -p "require('./package.json').version")" latest
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
