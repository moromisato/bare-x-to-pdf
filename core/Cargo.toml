[package]
name = "simple-converter-core"
version = "0.1.0"
edition = "2021"
rust-version = "1.92"
publish = false

[lib]
crate-type = ["staticlib", "rlib"]

[dependencies]
typst = "0.15"
typst-pdf = "0.15"
typst-layout = "0.15"
zip = { version = "8", default-features = false, features = ["deflate"] }
quick-xml = "0.42"
ttf-parser = "0.25"
cfb = "0.14"
encoding_rs = "0.8"
png = "0.18"
pulldown-cmark = { version = "0.13", default-features = false }

[profile.dev]
debug = 0
incremental = false

[profile.release]
debug = false
incremental = false
opt-level = "s"
lto = "fat"
codegen-units = 1
strip = true
